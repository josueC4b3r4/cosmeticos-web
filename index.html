<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo de Cosméticos Edith</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <h1>Cosméticos Edith</h1>
        <p>Skincare • Maquillaje • Fragancias • Cuidado personal</p>
      </div>
      <div class="controls" aria-label="Búsqueda y filtros">
        <input id="search" class="input" type="search" placeholder="Buscar (labial, crema, perfume...)" />
        <select id="category" class="select">
          <option value="all">Todas las categorías</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero" id="hero">
      <div>
        <h2>Belleza que resalta tu esencia ✨</h2>
        <small>Encuentra novedades, ofertas y productos para tu rutina diaria.</small>
      </div>
      <a class="pill" href="#grid">Explorar catálogo</a>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <div id="quickViewModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalProductName">
    <div class="modal-overlay"></div>
    <div class="modal-card">
      <button id="closeModalBtn" class="modal-close" aria-label="Cerrar modal">×</button>
      <div class="modal-layout">
        <img id="modalProductImage" src="" alt="" class="modal-image" />
        <div>
          <h3 id="modalProductName"></h3>
          <p id="modalProductDescription"></p>
          <div id="modalProductPrice" class="modal-price"></div>
          <div class="modal-actions">
            <a id="modalWaBuy" target="_blank" rel="noopener" class="btn btn-wa">Pedir por WhatsApp</a>
            <a id="modalWaShare" target="_blank" rel="noopener" class="btn btn-share">Compartir</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button id="scrollTopBtn" class="scroll-top hidden" aria-label="Volver arriba">↑</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
